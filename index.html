<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K RIDERS ONLINE INQUIRY</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #eef2f7; color: #0f2540; }
  .card { max-width: 520px; margin: 16px auto; background: #fff; border-radius: 10px; overflow: hidden; }
  header { background: #0f2540; color: #fff; padding: 18px 20px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 6px 0 0; font-size: 14px; color: #cbd5e1; }
  .body { padding: 8px 20px 20px; }
  label { display: block; margin-top: 14px; font-size: 14px; font-weight: bold; }
  input, select, textarea { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 10px;
    border: 1px solid #94a3b8; border-radius: 6px; font-size: 16px; font-family: inherit; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid #2563eb; }
  fieldset { border: 0; padding: 0; margin: 0; }
  button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 6px;
    background: #2563eb; color: #fff; font-size: 16px; font-weight: bold; }
  button:disabled { background: #94a3b8; }
  #who { font-size: 14px; margin: 10px 0 0; }
  #msg { margin-top: 14px; font-size: 14px; font-weight: bold; }
  .error { color: #b91c1c; } .success { color: #15803d; }
</style>
</head>
<body>
<div class="card">
  <header>
    <h1>K RIDERS ONLINE INQUIRY</h1>
    <p>Ask about our motorcycle units, prices and financing options. We will get back to you.</p>
  </header>
  <div class="body">
    <p style="font-size:14px">1. Sign in with your Google account to continue.</p>
    <div id="googleButton"></div>
    <p id="who"></p>

    <form id="inquiryForm" onsubmit="submitForm(event)">
      <fieldset id="fields" disabled>
        <label>Last Name *<input name="lastName" required></label>
        <label>First Name *<input name="firstName" required></label>
        <label>Middle Name<input name="middleName"></label>
        <label>Suffix<input name="suffix"></label>
        <label>Contact Number *
          <input name="contact" type="tel" inputmode="numeric" maxlength="11" pattern="09[0-9]{9}"
                 placeholder="09XXXXXXXXX" required></label>
        <label>Brand *<input name="brand" required></label>
        <label>Desired Unit *<input name="unit" required></label>
        <label>Color *<input name="color" required></label>
        <label>Payment Type *
          <select name="payment" required>
            <option value="">Choose one</option>
            <option>Cash</option>
                        <option>Installment</option>
          </select></label>
        <label id="branchPicker">Select Branch (Purchase/Release Location) *
          <select name="branch" required>
            <option value="">Choose one</option>
            <option>K Riders Poblacion-Liloan</option>
            <option>K Riders Catarman-Liloan</option>
            <option>K Riders Tabok-Mandaue</option>
            <option>K Riders Centro-Mandaue</option>
            <option>K Riders Babag II-LLC</option>
		            <option>K Riders Maribago-LLC</option>
          </select></label>
        <label id="branchFixed" style="display:none">Branch
          <input id="branchFixedText" readonly tabindex="-1" style="background:#e2e8f0"></label>
        <label>Note<textarea name="note" rows="3"></textarea></label>
        <button type="submit" id="sendButton">Send inquiry</button>
      </fieldset>
    </form>
    <p id="msg"></p>
  </div>
</div>

<script>
  // ===== SETTINGS: palitan ang dalawang ito =====
  var GOOGLE_CLIENT_ID = '540530581718-307joed6m8omvlbgu6ppki2ciuetppt1.apps.googleusercontent.com';
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2DJAqRCxGUImWey5Wt45abTIp52M-027sGKFq4YCXETtTylx-OSTQuTmYrK-LBiOw/exec';

  var idToken = '';
    // Ang referral code at src ay galing sa link (?src=...&ref=...). Walang field para galawin ito.
  var params = new URLSearchParams(location.search);
  var ref = params.get('ref') || '';
    var src = params.get('src') || '';

  // Mga branch (dapat kapareho ng listahan sa Apps Script)
  var BRANCHES = ['K Riders Poblacion-Liloan', 'K Riders Catarman-Liloan', 'K Riders Tabok-Mandaue',
    'K Riders Centro-Mandaue', 'K Riders Babag II-LLC', 'K Riders Maribago-LLC'];

  // Walk-in: ang branch ay galing sa link, hindi na pipili ang customer
  if (src === 'walkin') {
    var walkInBranch = BRANCHES.filter(function (b) {
      return b.toLowerCase() === ref.trim().replace(/\s+/g, ' ').toLowerCase();
    })[0];
    if (walkInBranch) {
      var picker = document.querySelector('select[name="branch"]');
      picker.required = false;
      picker.disabled = true; // hindi na ito ipapadala
      document.getElementById('branchPicker').style.display = 'none';
      document.getElementById('branchFixed').style.display = 'block';
      document.getElementById('branchFixedText').value = walkInBranch;
    } else {
      ref = ''; // hindi kilalang branch, kaya invalid link
    }
  }

  function showMessage(text, isError) {
    var box = document.getElementById('msg');
    box.textContent = text;
    box.className = isError ? 'error' : 'success';
  }

  // Tinatawag ng Google pagkatapos mag-sign in
  function onGoogleLogin(response) {
    idToken = response.credential;
    var payload = JSON.parse(atob(idToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    document.getElementById('who').textContent = 'Signed in as ' + payload.email;
    document.getElementById('fields').disabled = false; // saka lang magbubukas ang form
  }

  function initGoogle() {
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleLogin });
    google.accounts.id.renderButton(document.getElementById('googleButton'),
      { theme: 'outline', size: 'large' });
  }

  async function submitForm(event) {
    event.preventDefault();
    var data = Object.fromEntries(new FormData(event.target));
    data.idToken = idToken;
	data.ref = ref;
    data.src = src;
    var button = document.getElementById('sendButton');
    button.disabled = true;
    showMessage('Sending...', false);
    try {
      // text/plain para hindi mag-preflight ang browser sa Apps Script
      var res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });
      var result = await res.json();
      if (result.ok) {
        document.getElementById('inquiryForm').style.display = 'none';
        showMessage('Thank you! Your inquiry was sent. We will contact you soon.', false);
      } else {
        showMessage(result.message, true);
        button.disabled = false;
      }
    } catch (err) {
      showMessage('Could not send. Check your connection and try again.', true);
      button.disabled = false;
    }
  }

  if (!ref || !src) {
	  document.getElementById('fields').disabled = true;
    showMessage('Invalid link. Please scan the QR code again.', true);
  }
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()"></script>
</body>
</html>
